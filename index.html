<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新HSK3.0 1级 词汇练习游戏 - Từ vựng HSK3.0 cấp 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f5f0eb 0%, #e6ddd5 100%);
            min-height: 100vh;
            padding: 24px 20px 40px;
        }

        .app-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 250, 245, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 28px 32px 40px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 2px dashed rgba(170, 130, 100, 0.25);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #4d3524;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #8a6e5a;
            background: rgba(200, 175, 155, 0.3);
            padding: 4px 18px;
            border-radius: 40px;
        }

        .header .badge {
            background: #c9b09b;
            color: #2d1f15;
            padding: 6px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.4);
        }

        /* controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 20px;
            align-items: center;
            margin-bottom: 22px;
        }

        .controls .search-box {
            flex: 1 1 240px;
            min-width: 160px;
            position: relative;
        }

        .controls .search-box input {
            width: 100%;
            padding: 10px 18px 10px 44px;
            border-radius: 40px;
            border: 2px solid #d5c0b0;
            background: rgba(255, 252, 248, 0.7);
            font-size: 16px;
            color: #3d291c;
            outline: none;
            transition: 0.2s;
        }

        .controls .search-box input:focus {
            border-color: #b8865a;
            background: #fffcf9;
            box-shadow: 0 0 0 4px rgba(184, 134, 90, 0.12);
        }

        .controls .search-box .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #8a6e5a;
        }

        .controls .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .controls .btn-group button {
            padding: 10px 26px;
            border-radius: 40px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(200, 180, 165, 0.25);
            color: #4d3727;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .controls .btn-group button:hover {
            background: rgba(184, 134, 90, 0.2);
            transform: translateY(-2px);
        }

        .controls .btn-group button.shuffle-btn {
            background: #b8865a;
            color: #fff;
        }

        .controls .btn-group button.shuffle-btn:hover {
            background: #a06d44;
            box-shadow: 0 8px 20px -8px rgba(184, 134, 90, 0.4);
        }

        .controls .btn-group button.reset-btn {
            background: rgba(160, 140, 125, 0.2);
        }

        .controls .stats {
            font-size: 15px;
            color: #7a604b;
            font-weight: 500;
            margin-left: auto;
            white-space: nowrap;
        }

        /* card grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
            margin-top: 6px;
        }

        /* card */
        .card {
            perspective: 800px;
            height: 190px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 20px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(220, 200, 185, 0.3);
            background: #fffcf9;
            transition: box-shadow 0.2s;
        }

        .card:hover .card-front:not(.flipped) {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.07);
            transform: translateY(-3px);
        }

        .card-back {
            transform: rotateY(180deg);
            background: #f8f1ea;
            border-color: #d5c0b0;
        }

        .card-front .hanzi {
            font-size: 36px;
            font-weight: 700;
            color: #3d291c;
            line-height: 1.2;
            word-break: break-all;
        }

        .card-front .hint {
            font-size: 12px;
            color: #b09a87;
            margin-top: 8px;
            opacity: 0.6;
        }

        .card-back .pinyin {
            font-size: 20px;
            font-weight: 700;
            color: #a87550;
            margin-bottom: 4px;
        }

        .card-back .pos {
            font-size: 13px;
            color: #7a604b;
            background: rgba(200, 175, 155, 0.25);
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 6px;
        }

        .card-back .meaning {
            font-size: 18px;
            font-weight: 500;
            color: #2d6b5a;
            line-height: 1.3;
            margin-top: 2px;
        }

        /* empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #8a6e5a;
            font-size: 18px;
        }

        .empty-state span {
            display: block;
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* responsive */
        @media (max-width: 768px) {
            .app-wrapper {
                padding: 18px 14px 28px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 22px;
            }
            .header h1 small {
                font-size: 13px;
                padding: 2px 12px;
            }
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 14px;
            }
            .card {
                height: 160px;
            }
            .card-front .hanzi {
                font-size: 28px;
            }
            .card-back .pinyin {
                font-size: 17px;
            }
            .card-back .meaning {
                font-size: 15px;
            }
            .controls .stats {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
            .controls .btn-group button {
                padding: 8px 18px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 12px;
            }
            .card {
                height: 140px;
            }
            .card-front .hanzi {
                font-size: 24px;
            }
            .card-back .pinyin {
                font-size: 15px;
            }
            .card-back .meaning {
                font-size: 13px;
            }
            .card-back .pos {
                font-size: 11px;
                padding: 1px 10px;
            }
            .header h1 {
                font-size: 18px;
            }
            .header .badge {
                font-size: 12px;
                padding: 4px 14px;
            }
        }
    </style>
</head>

        // ============================================================
        //  APP STATE
        // ============================================================
        let cards = [];
        let filteredCards = [];
        let currentOrder = 'original'; // 'original' or 'shuffled'
        let originalOrder = [];

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            // Build card objects
            cards = RAW_DATA.map((item, idx) => ({
                id: idx,
                hanzi: item[0],
                pinyin: item[1],
                pos: item[2] || '',
                meaning: item[3] || '',
                flipped: false,
            }));
            originalOrder = cards.map(c => c.id);
            filteredCards = [...cards];
            renderCards();
            updateStats();
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderCards() {
            const grid = document.getElementById('cardGrid');
            if (filteredCards.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <span>🔍</span>
                        Không tìm thấy từ nào · 未找到匹配词汇
                    </div>
                `;
                return;
            }

            let html = '';
            filteredCards.forEach(card => {
                const flippedClass = card.flipped ? 'flipped' : '';
                html += `
                    <div class="card ${flippedClass}" data-id="${card.id}" onclick="flipCard(${card.id})">
                        <div class="card-inner">
                            <div class="card-front">
                                <div class="hanzi">${card.hanzi}</div>
                                <div class="hint">👆 chạm để lật · 点击翻卡</div>
                            </div>
                            <div class="card-back">
                                <div class="pinyin">${card.pinyin}</div>
                                ${card.pos ? `<div class="pos">${card.pos}</div>` : ''}
                                <div class="meaning">${card.meaning}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            updateStats();
        }

        // ============================================================
        //  CARD ACTIONS
        // ============================================================
        function flipCard(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;
            card.flipped = !card.flipped;
            // Update in filtered array as well
            const fCard = filteredCards.find(c => c.id === id);
            if (fCard) fCard.flipped = card.flipped;
            renderCards();
        }

        function resetAllFlip() {
            cards.forEach(c => c.flipped = false);
            filteredCards.forEach(c => c.flipped = false);
            renderCards();
        }

        // ============================================================
        //  SHUFFLE & ORDER
        // ============================================================
        function shuffleCards() {
            const shuffled = shuffleArray([...filteredCards]);
            filteredCards = shuffled;
            currentOrder = 'shuffled';
            renderCards();
        }

        function resetOrder() {
            // Restore original order (by id)
            filteredCards.sort((a, b) => a.id - b.id);
            currentOrder = 'original';
            renderCards();
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ============================================================
        //  SEARCH / FILTER
        // ============================================================
        function filterCards() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                filteredCards = [...cards];
            } else {
                filteredCards = cards.filter(c =>
                    c.hanzi.includes(query) ||
                    c.pinyin.toLowerCase().includes(query) ||
                    c.meaning.toLowerCase().includes(query) ||
                    (c.pos && c.pos.toLowerCase().includes(query))
                );
            }
            // Preserve flip state from cards
            filteredCards.forEach(fc => {
                const orig = cards.find(c => c.id === fc.id);
                if (orig) fc.flipped = orig.flipped;
            });
            renderCards();
        }

        // ============================================================
        //  STATS
        // ============================================================
        function updateStats() {
            document.getElementById('visibleCount').textContent = filteredCards.length;
            document.getElementById('totalCount').textContent = cards.length;
        }

        // ============================================================
        //  START
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
